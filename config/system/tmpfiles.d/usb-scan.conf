# USB Scan Station directories (systemd-tmpfiles). Sockets inside /run/usb-scan carry their own
# owner/group/mode, set by the service that creates them.
#Type Path                                   Mode User           Group          Age
d     /run/usb-scan                          0755 root           root           -
d     /etc/usb-scan                          0755 root           root           -
d     /etc/usb-scan/secrets                  0711 root           root           -
d     /var/lib/usb-scan                      0755 root           root           -
d     /var/lib/usb-scan/orchestrator         0700 usbscan        usbscan        -
d     /var/lib/usb-scan/events               0700 usbscan-events usbscan-events -
d     /var/lib/usb-scan/web                  0700 usbscan-web    usbscan-web    -
d     /var/lib/usb-scan/gui                  0700 usbscan-gui    usbscan-gui    -
d     /var/lib/usb-scan/yara-state           0700 yarascan       yarascan       -
d     /var/lib/usb-scan/rules                0755 usbscan-update usbscan-update -
d     /var/lib/usb-scan/rules/versions       0755 usbscan-update usbscan-update -
d     /var/lib/usb-scan/quarantine           0700 usbscan        usbscan        -
d     /var/log/usb-scan                      0750 root           usbscan        -
