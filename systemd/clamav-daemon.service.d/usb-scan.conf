# Drop-in for the distribution clamav-daemon.service (spec §5.4): clamd receives files as
# descriptors (FILDES) and needs no access to USB mounts or the quarantine.
[Service]
ProtectSystem=strict
ProtectHome=yes
PrivateDevices=yes
NoNewPrivileges=yes
InaccessiblePaths=-/run/usb-scan/mounts -/var/lib/usb-scan/quarantine -/etc/usb-scan/secrets
# clamd writes its socket/pid under /run/clamav and logs under /var/log/clamav; the signature
# database is updated by clamav-freshclam into /var/lib/clamav.
ReadWritePaths=-/run/clamav -/var/log/clamav
