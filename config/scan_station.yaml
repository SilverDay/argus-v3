# USB Scan Station configuration template (spec v1.5 §6).
#
# Installed to /etc/usb-scan/scan_station.yaml. This file contains NO secrets and
# NO credential hashes. Secret fields hold references only:
#   file:/abs/path        root-controlled file (not accessible by "other")
#   credential:<name>     systemd credential ($CREDENTIALS_DIRECTORY/<name>)
#   env:<NAME>            environment variable — development only (needs USB_SCAN_DEV=1)
# Unknown keys are rejected; omitted keys take the defaults in src/shared/config.py.

schema_version: 1

station:
  station_id: station-001
  data_dir: /var/lib/usb-scan
  log_dir: /var/log/usb-scan
  run_dir: /run/usb-scan

device:
  max_device_capacity_gb: 2048          # FR-USB-09: excess -> REJECTED, never CLEAN
  internal_device_sysfs_prefixes: []    # FR-USB-08: never offered for scanning
  require_full_coverage: true           # uninspected partition -> INCOMPLETE
  insertion_debounce_ms: 500
  # FR-USB-04 explicit policy: partitions with NO filesystem signature and one of these
  # partition types are reported as out of scope instead of making the scan INCOMPLETE.
  # Example (GPT Microsoft Reserved Partition): e3c9e316-0b5c-4db8-817d-f92df00215ae
  excludable_partition_types: []
  excludable_partition_max_mb: 128

broker:
  socket_path: /run/usb-scan/broker.sock   # 0660 root:usbscan (connect needs group write)
  client_user: usbscan                     # only this uid may connect (SO_PEERCRED)
  socket_group: usbscan
  read_group: usbscan-read                 # gid owning mount dirs; scanner users are members
  mounts_dir: /run/usb-scan/mounts
  audit_log: /var/log/usb-scan/broker-audit.log
  hmac_key_ref: file:/etc/usb-scan/secrets/broker-hmac.key
  ntfs_driver: ntfs3                       # ntfs3 | ntfs-3g — validate on target kernel (FR-USB-05)
  command_timeout_seconds: 30
  max_clock_skew_seconds: 30

orchestrator:
  state_socket: /run/usb-scan/state.sock
  client_users: [usbscan-gui, usbscan-led]   # uids allowed on the state socket
  gui_user: usbscan-gui                      # only uid allowed to send operator messages
  socket_group: usbscan-gui
  health_interval_seconds: 60
  removed_result_display_seconds: 15   # result shown after removal mid-scan
  result_display_seconds: 300          # result shown after logical eject (removal not observable)
  storage_wait_seconds: 10             # authorized USB device without storage -> REJECTED
  thermal_zone_path: /sys/class/thermal/thermal_zone0/temp
  state_dir: /var/lib/usb-scan/orchestrator   # auth.db (PIN lockout), crash marker, event spool
  event_spool_max_mb: 64               # used only while the events service is unreachable

gui:
  long_press_ms: 3000                 # hidden operator area, spec §4.3
  ambient_after_seconds: 300          # privacy/ambient screen when idle, spec §4.4
  language: en
  translations_dir: /opt/usb-scan/translations
  hide_cursor: true
  show_signature_names: true          # detection names on the public result screen
  fullscreen: true

led:
  driver: auto                        # auto | lgpio | stub — use lgpio in production
  gpiochip: 0                         # Pi 5 header GPIOs: verify with `gpiodetect` on the target kernel
  pin_red: 17                         # BCM numbering, spec §5.1
  pin_green: 27
  pin_blue: 22
  common_anode: false                 # spec: common-cathode RGB LED (GPIO high = on)
  pwm_frequency_hz: 200
  brightness_percent: 100
  frames_per_second: 25

scan:
  global_timeout_seconds: 3600
  max_files: 500000
  max_depth: 64
  max_bytes_total_gb: 2048
  block_extensions: []                  # policy violations, not malware detections
  allow_extensions: []                  # non-empty = restricted scope, disclosed in report/UI
  blocked_extension_severity: suspicious  # threat | suspicious (open decision, spec §15.2 #6)
  progress_interval_ms: 500

clamav:
  role: mandatory                       # ClamAV is always mandatory
  socket_path: /var/run/clamav/clamd.ctl
  max_signature_age_hours: 24
  per_file_timeout_seconds: 120
  max_file_size_mb: 2047                # ClamAV limit is 2 GB; keep equal to clamd.conf MaxFileSize
  connect_timeout_seconds: 10
  concurrency: 2                        # parallel clamd FILDES requests

yara:
  enabled: false
  role: advisory                        # mandatory: no verified ruleset -> NOT_READY
  # Signed bundle: rule files + manifest.json (version, sha256 per file) + minisign signature.
  rules_path: /var/lib/usb-scan/rules/active
  ruleset_signature_path: /var/lib/usb-scan/rules/active/manifest.json.minisig
  trust_anchor_path: /etc/usb-scan/yara-rules.pub   # minisign public key
  minisign_path: /usr/bin/minisign
  state_dir: /var/lib/usb-scan/yara-state           # rollback guard (last accepted version)
  socket_path: /run/usb-scan/yara.sock
  client_user: usbscan
  socket_group: usbscan
  per_file_timeout_seconds: 60          # libyara native timeout
  global_budget_seconds: 1800           # per scan session; worker child killed when exceeded
  memory_limit_mb: 1024                 # RLIMIT_AS of the per-session worker child
  max_file_size_mb: 256                 # larger files are not YARA-scanned (reported)

virustotal:
  enabled: false                        # hash-only lookups; no file uploads
  role: advisory
  api_key_ref: ""                       # e.g. credential:vt_api_key
  on_quota_or_network_failure: continue # mandatory role requires incomplete | error
  network_outage_policy_ref: ""         # mandatory role requires a documented outage policy (doc ID/URL)
  cache_ttl_days: 7
  rate_limit_per_minute: 4
  large_file_hash_budget_mb: 4096       # per-scan SHA-256 hashing budget (not an upload limit)
  request_timeout_seconds: 15
  suspicious_min_malicious: 1           # >= N engines "malicious" -> SUSPICIOUS
  threat_min_malicious: 5               # >= N engines "malicious" -> THREAT
  cache_path: /var/lib/usb-scan/orchestrator/vt_cache.db   # cache_ttl_days: 0 disables the cache
  finish_wait_seconds: 120              # wait for outstanding lookups after the local scan
  ca_file: ""                           # optional extra CA; verification is always on

operator_hold:
  enabled: false
  max_duration_seconds: 60              # 15..300
  allowed_verdicts: [CLEAN]             # CLEAN and/or SUSPICIOUS, never THREAT

pin:
  hash_algorithm: bcrypt
  bcrypt_cost: 12
  hash_ref: file:/etc/usb-scan/secrets/operator_pin.hash
  min_length: 6
  max_length: 12
  max_failed_attempts: 5
  lockout_minutes: 15
  deny_list_path: ""

auth:
  web:
    oidc_enabled: true
    require_mfa: true                   # mandatory with OIDC
    local_fallback_allowed: false       # isolated management networks only

quarantine:
  quarantine_on_threat: false           # copies THREAT-level (high severity) detections only
  path: /var/lib/usb-scan/quarantine    # mount point of a LUKS2 mapping, rw,nodev,nosuid,noexec, mode 0700
  retention_days: 30
  min_free_mb: 1024
  max_file_size_mb: 2047
  max_files_per_scan: 50
  export_enabled: false                 # not implemented; must stay false

alerts:
  verdicts: [THREAT, SUSPICIOUS, INCOMPLETE, ERROR, REJECTED]
  not_ready: true                       # alert when a health gate fails
  webhook:
    enabled: false
    url: ""                             # https:// only
    token_ref: ""                       # e.g. credential:alert_webhook_token (Authorization: Bearer)
    timeout_seconds: 10
    ca_file: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    security: starttls                  # starttls | tls (implicit, port 465)
    username: ""
    password_ref: ""                    # e.g. credential:smtp_password
    from_addr: ""
    to_addrs: []
    timeout_seconds: 20
    ca_file: ""
  syslog:
    enabled: false
    host: ""
    port: 6514                          # TLS only (RFC 5425)
    format: rfc5424                     # rfc5424 (JSON body) | cef
    timeout_seconds: 10
    ca_file: ""

admin_web:
  enabled: false                        # enable only after HTTPS + auth are configured
  bind_host: 127.0.0.1
  bind_port: 8080

logging:
  level: INFO
  file: /var/log/usb-scan/usb-scan.jsonl
  filename_privacy: hash                # plain | hash | omit
  pseudonymization_key_ref: ""
  syslog:
    enabled: false
    host: ""
    port: 6514
    transport: tls                      # udp | tcp | tls
    ca_file: ""

events:
  db_path: /var/lib/usb-scan/events/events.db     # owned by usbscan-events, 0600
  socket_path: /run/usb-scan/events.sock
  socket_group: usbscan                 # socket 0660 usbscan-events:usbscan
  writer_users: [usbscan]               # orchestrator: append + query
  reader_users: [usbscan-web]           # admin web: query only
  hmac_key_ref: file:/etc/usb-scan/secrets/events-checkpoint.key   # >= 32 bytes
  checkpoint_interval_hours: 1
  retention_days: 180                   # only fully delivered events are pruned
  min_free_mb: 256                      # writes refused below this (NOT_READY)
  max_attempts: 10                      # per queue entry, then dead-lettered
  backoff_initial_seconds: 5            # doubles per attempt
  backoff_max_seconds: 600
  forwarding:                           # off-device audit forwarding (SIEM / central collector)
    enabled: false
    transport: syslog                   # syslog (RFC 5424 over TLS) | webhook (https)
    host: ""
    port: 6514
    url: ""
    token_ref: ""                       # webhook bearer token
    ca_file: ""
    client_cert_file: ""                # mTLS station identity (spec §9.2)
    client_key_ref: ""                  # file: or credential: reference
    timeout_seconds: 10

health:
  min_free_disk_mb: 512
  max_cpu_temp_c: 80
  min_valid_year: 2026
