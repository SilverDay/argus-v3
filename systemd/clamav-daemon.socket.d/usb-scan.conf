# Drop-in for the distribution clamav-daemon.socket (socket activation of clamd).
# systemd creates the socket node with SocketMode=0666 unless told otherwise
# (systemd.socket(5)), and clamd then inherits it, so LocalSocketMode/LocalSocketGroup
# in clamd.conf do not apply. Some distribution builds sync them with a generator; this
# drop-in does not rely on it. Only root and group clamav (the orchestrator user is a
# member) may connect, matching config/clamd.conf.recommended.
[Socket]
SocketUser=clamav
SocketGroup=clamav
SocketMode=0660
