# USB Scan Station USBGuard policy (spec §8.2). First matching rule wins; anything that
# matches no rule is blocked (ImplicitPolicyTarget=block). USB controllers/root hubs keep
# their state (PresentControllerPolicy=keep).
#
# 1. Any device presenting a HID interface (keyboards, BadUSB composites) is BLOCKED before
#    any scan state is entered: deauthorised, so no driver binds to any of its interfaces.
#    `block` rather than `reject` (owner decision, spec 1.5.8): `reject` also removes the device
#    from the bus, and the orchestrator could then only log "device_gone"; with `block` it
#    deterministically records REJECTED / usb_policy_blocked in the audit chain (AC-S02).
block with-interface one-of { 03:*:* }
# 2. Only devices whose interfaces are ALL mass storage (class 08) are authorised.
#    Hubs (09), network (02/e0), video, vendor-specific ... are implicitly blocked.
allow with-interface equals { 08:*:* }
