# USB Scan Station service identities (spec §5.4). Installed to /usr/lib/sysusers.d/ or
# /etc/sysusers.d/ by scripts/first-boot-setup.sh; applied with systemd-sysusers.
# All accounts are system users without a login shell.

# Groups shared between services
# broker mounts non-POSIX filesystems with this gid (orchestrator reads)
g usbscan-read  -
# events.sock group: orchestrator + admin web only
g usbscan-audit -

#Type Name            ID  GECOS                                  Home                       Shell
u     usbscan         -   "USB Scan Station orchestrator"        /var/lib/usb-scan/orchestrator /usr/sbin/nologin
u     usbscan-gui     -   "USB Scan Station kiosk GUI"           /var/lib/usb-scan/gui      /usr/sbin/nologin
u     usbscan-led     -   "USB Scan Station status LED"          -                          /usr/sbin/nologin
u     usbscan-events  -   "USB Scan Station events/audit"        /var/lib/usb-scan/events   /usr/sbin/nologin
u     usbscan-web     -   "USB Scan Station admin web"           /var/lib/usb-scan/web      /usr/sbin/nologin
u     yarascan        -   "USB Scan Station YARA worker"         -                          /usr/sbin/nologin
u     usbscan-update  -   "USB Scan Station rule updater"        -                          /usr/sbin/nologin

# Memberships (least privilege; see docs/deployment.md)
# read files on broker mounts
m usbscan        usbscan-read
# append to events.sock
m usbscan        usbscan-audit
# clamd socket 0660 clamav:clamav (config/clamd.conf.recommended)
m usbscan        clamav
# query events.sock + own audit events
m usbscan-web    usbscan-audit
# chown its socket to this group
m usbscan-events usbscan-audit
# state.sock 0660 usbscan:usbscan-gui (read-only client)
m usbscan-led    usbscan-gui
# /dev/gpiochip* on Raspberry Pi OS
m usbscan-led    gpio
# DRM/KMS for the cage kiosk compositor
m usbscan-gui    video
m usbscan-gui    render
# touchscreen
m usbscan-gui    input
