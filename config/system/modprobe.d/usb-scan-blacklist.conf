# Kernel surface reduction (spec §8.2). The broker mounts only vfat, exfat, ntfs3, ext2/3/4
# and iso9660, always with an explicit filesystem type; everything below is never needed.
# "install ... /bin/false" also stops explicit modprobe/autoload, "blacklist" stops alias loading.
blacklist cramfs
install cramfs /bin/false
blacklist freevxfs
install freevxfs /bin/false
blacklist jffs2
install jffs2 /bin/false
blacklist hfs
install hfs /bin/false
blacklist hfsplus
install hfsplus /bin/false
blacklist udf
install udf /bin/false
blacklist squashfs
install squashfs /bin/false
blacklist romfs
install romfs /bin/false
blacklist minix
install minix /bin/false
blacklist erofs
install erofs /bin/false
# Rarely used network protocols
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
